# Пошук по журналу. Решта налаштувань — у фронтматері pages/02.blog/blog.md,
# бо вони стосуються саме тієї сторінки (маршрут і межі пошуку).
enabled: true

# Плагін інакше підмішує свій css і свій js у КОЖНУ сторінку сайту
# (onTwigSiteVariables спрацьовує скрізь, не лише на маршруті пошуку).
# Обидва файли з чужої системи класів, а форму ми малюємо власну.
built_in_css: false
built_in_js: false

# Єдиний маршрут із пошуком — журнал. Дефолтний /search не лишаємо:
# сторінки з такою адресою немає, і плагін вигадав би віртуальну.
route: /blog

# Шукаємо по вихідному markdown, а не по відрендереному html:
# інакше кожен запит змушував би Grav зібрати всі записи повністю.
search_content: raw
