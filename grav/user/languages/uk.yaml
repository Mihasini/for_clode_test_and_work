# Латки до українського перекладу ядра Grav (system/languages/uk.yaml).
# Файли з user/languages перекривають ядро, тому виправлення переживають оновлення.
#
# Чому взагалі потрібні: у system.yaml supported: [uk], тож підмінити відсутній
# ключ англійським Grav не може — у лист і на сторінку їде сам ключ, як є.
GRAV:
  # Без цих двох у листі з форми замість «Так» стояло GRAV.YES:
  # так плагін form показує значення чекбокса (згоду з умовами)
  'YES': 'Так'
  'NO': 'Ні'
