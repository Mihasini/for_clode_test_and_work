name: F1Monkey
slug: f1monkey
type: theme
version: 0.1.0
description: 'Брутально-редакційна тема: монохром на теплому сірому, велика типографіка, нуль тіней'
icon: rebel
author:
  name: Misha
  email: misha707070@gmail.com
license: MIT

compatibility:
  grav: ['2.0']

dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
    validation: loose
    fields:
        dropdown.enabled:
            type: toggle
            label: Випадаюче меню
            highlight: 1
            default: 1
            options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            validate:
                type: bool
        production:
            type: toggle
            label: Продакшн-режим
            help: 'Підключає site.min.css замість site.css. Потребує npm run prod.'
            highlight: 0
            default: 0
            options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
            validate:
                type: bool
